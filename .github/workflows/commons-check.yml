# Checks how Wikimedia Commons serves a few photos (thumbnail sizes, file sizes). Read-only.
name: Commons check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='CaptainsOfJawaiWebsite/2.1 (+https://captainsofjawai.com; media importer)'
          for f in "The_view_of_Sena_Village_of_Jawai,_Rajasthan.jpg" "JAWAI_BERA_LOCAL_HUT.jpg" "JAWAI_BERA_LOCALS.jpg"; do
            echo "=== $f"
            j=$(curl -s -A "$UA" "https://commons.wikimedia.org/w/api.php?action=query&format=json&formatversion=2&prop=imageinfo&iiprop=url|size|mime&iiurlwidth=1920&titles=File:${f// /_}")
            echo "$j" | python3 -c 'import json,sys; ii=json.load(sys.stdin)["query"]["pages"][0]["imageinfo"][0]; print(ii["width"],ii["height"],ii["size"]); print(ii.get("thumburl")); print(ii["url"])'
            t=$(echo "$j" | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"]["pages"][0]["imageinfo"][0].get("thumburl",""))')
            for u in "$t" "${t/1920px-/1280px-}" "${t/1920px-/960px-}"; do curl -s -A "$UA" -o /dev/null -w "%{http_code} %{size_download} %{content_type} $u\n" "$u"; done
          done
