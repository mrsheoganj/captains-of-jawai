# Deploy the website to GoDaddy cPanel hosting over SSH.
# Run it from GitHub: Actions -> "Deploy to GoDaddy" -> Run workflow.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions -> New repository secret):
#   SSH_HOST      your server host name or IP (cPanel -> SSH Access shows it)
#   SSH_USER      your cPanel username
#   SSH_KEY       the PRIVATE key (whole text, including the BEGIN/END lines) of a key pair whose
#                 public key is authorized in cPanel -> SSH Access -> Manage SSH Keys
#   SSH_PORT      optional, defaults to 22
#   DEPLOY_PATH   the folder that contains public_html, e.g. /home/<cpanel-username>
#
# What it copies: public_html/ and private/ from this repository (as a tar archive over SSH,
# so it works on shared hosting without rsync).
# What it never touches: private/config.php (database, admin path), private/storage/ (sessions, logs,
# SQLite) and public_html/uploads/ (your uploaded photos). Nothing on the server is deleted.
name: Deploy to GoDaddy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: list what would change without uploading"
        type: boolean
        default: false

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          for v in SSH_HOST SSH_USER SSH_KEY DEPLOY_PATH; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; exit 1; fi
          done

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "
            cd '$DEPLOY_PATH' || { echo 'DEPLOY_PATH not found: $DEPLOY_PATH'; exit 1; }
            echo '--- server folder:'; pwd
            echo '--- public_html:'; ls -d public_html || exit 1
            echo '--- private folder next to public_html:'; ls -d private 2>/dev/null || echo 'no private/ folder yet (will be created)'
            echo '--- existing config:'; ls private/config.php 2>/dev/null || echo 'no private/config.php here'
            echo '--- PHP:'; (php -v || /usr/local/bin/php -v) 2>/dev/null | head -1
          " | tee server-check.txt

      - name: Show files that will be uploaded
        run: |
          tar -czf site.tgz \
            --exclude='private/config.php' --exclude='private/storage' --exclude='public_html/uploads' \
            private public_html
          echo "Files in the upload: $(tar -tzf site.tgz | grep -vc '/$')"
          tar -tzf site.tgz | grep -v '/$' | head -400

      - name: Upload files
        if: ${{ !inputs.dry_run }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # tar over SSH: works on shared hosting without rsync. Overwrites files, never deletes any.
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && tar -xzf - --no-same-owner && echo 'Upload complete'" < site.tgz

      - name: Run database updates
        if: ${{ !inputs.dry_run }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && (php private/cli/install.php --migrate || /usr/local/bin/php private/cli/install.php --migrate)"

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
