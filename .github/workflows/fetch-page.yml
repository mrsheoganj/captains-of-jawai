# Read-only: fetches public web pages (HTML + a screenshot) and pushes them to the page-fetch branch.
# Used to read reference sites that the build container cannot reach. Changes nothing on the website.
name: Fetch page

on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated URLs
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir out && cd out
          i=0
          for u in $URLS; do i=$((i+1)); curl -sSL -m 30 -A "Mozilla/5.0" "$u" -o "page-$i.html" || true; echo "$i $u" >> index.txt; done
          # Response headers as Googlebot sees them (status, redirects, content type)
          i=0
          for u in $URLS; do i=$((i+1)); curl -sS -m 30 -o /dev/null -D "headers-$i.txt" -w "final: %{http_code} %{url_effective} %{content_type} %{size_download} bytes\n" -L -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" "$u" >> "headers-$i.txt" 2>&1 || true; done
          npm i -s playwright@1.47.2 >/dev/null 2>&1 && npx -y playwright@1.47.2 install --with-deps chromium >/dev/null 2>&1
          cat > shot.js <<'JS'
          const { chromium } = require('playwright');
          (async () => { const b = await chromium.launch(); const p = await b.newPage({ viewport: { width: 1366, height: 900 } });
            const urls = process.argv.slice(2); for (let i = 0; i < urls.length; i++) { try { await p.goto(urls[i], { waitUntil: 'load', timeout: 45000 }); await p.waitForTimeout(2500);
              await p.screenshot({ path: `shot-${i + 1}.png`, fullPage: true }); require('fs').writeFileSync(`text-${i + 1}.txt`, await p.evaluate(() => document.body.innerText));
              const imgs = await p.evaluate(() => [...document.querySelectorAll('img,link[rel*=icon]')].map(e => e.src || e.href)); require('fs').writeFileSync(`imgs-${i + 1}.txt`, imgs.join('\n')); } catch (e) { console.log(urls[i], e.message); } }
            await b.close(); })();
          JS
          node shot.js $URLS || true
          rm -rf node_modules package*.json shot.js
          git init -q && git checkout -q -b page-fetch && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Page fetch $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" page-fetch
